---
# Release mode installation - Install via npm from npm registry

- name: Install OpenClaw globally as openclaw user (using npm)
  ansible.builtin.shell:
    cmd: npm install -g openclaw@latest
    executable: /bin/bash
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    NPM_CONFIG_PREFIX: "{{ openclaw_home }}/.local"
    PATH: "{{ openclaw_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    HOME: "{{ openclaw_home }}"
  register: openclaw_install
  changed_when: true

- name: Verify openclaw installation
  ansible.builtin.shell:
    cmd: openclaw --version
    executable: /bin/bash
  become: true
  become_user: "{{ openclaw_user }}"
  environment:
    NPM_CONFIG_PREFIX: "{{ openclaw_home }}/.local"
    PATH: "{{ openclaw_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
    HOME: "{{ openclaw_home }}"
  register: openclaw_version
  changed_when: false

- name: Display installed OpenClaw version (release)
  ansible.builtin.debug:
    msg: "OpenClaw installed from npm: {{ openclaw_version.stdout }}"
